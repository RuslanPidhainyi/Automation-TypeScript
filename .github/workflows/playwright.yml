name: Playwright Tests

# The whole stack on every runner: SQL Server as a service container, the API and the client started by
# playwright.config.ts's webServer (START_STACK=1). Every shard walks the layers in pipeline order -
# seed-users -> health -> api + database -> setup -> its share of smoke, accessibility and e2e, plus regression in
# three browsers at night - because Playwright runs a project's dependencies in every shard. The shards write blob
# reports and the `report` job merges them into one HTML report, one JUnit file, reports/test-ids.* and
# reports/custom-report/.
# The secrets and variables this needs are listed in README.md, "CI".
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 2 * * *' # nightly, with regression
  workflow_dispatch:
    inputs:
      regression:
        description: Run regression in three browsers as well
        type: boolean
        default: false

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: shard ${{ matrix.shardIndex }} of ${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # A run with regression is split across three runners. A push or a pull request (smoke, accessibility and
        # e2e) is short enough that three stacks would cost more than they save.
        shardIndex: ${{ fromJSON((github.event_name == 'schedule' || inputs.regression) && '[1, 2, 3]' || '[1]') }}
        shardTotal: ${{ fromJSON((github.event_name == 'schedule' || inputs.regression) && '[3]' || '[1]') }}

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # The database lives only as long as the job and is reachable only from the runner, so its password is not
          # a secret. SQL Server refuses to start without one that meets its policy (8+ characters, three of: upper
          # case, lower case, digit, symbol). The same value is in DB_PASSWORD and Data__Connection below.
          MSSQL_SA_PASSWORD: TravelApp_CI_2026
        ports:
          - 1433:1433
        # The API migrates and seeds on startup and gives up on a database that is not answering yet.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      CI: 'true'
      RUN_REGRESSION: ${{ github.event_name == 'schedule' || inputs.regression == true }}
      START_STACK: '1'
      APP_DIR: app
      # No mkcert certificate on the runner: the client is served over HTTP, the API over HTTPS with a dev certificate.
      BASE_URL: http://localhost:4200
      TIMEOUT_MULTIPLIER: '2'
      NG_CLI_ANALYTICS: 'false'

      # The suite's own connection to the database (src/helpers/db/mssql.helper.ts).
      DB_DRIVER: tedious
      DB_SERVER: localhost
      DB_PORT: '1433'
      DB_NAME: TravelApp
      DB_USER: sa
      DB_PASSWORD: TravelApp_CI_2026

      # The API's configuration - appsettings*.json are not in the application repository. TokenKey is generated for
      # every run by the step "Generate the API's TokenKey".
      Data__Connection: Server=localhost,1433;Database=TravelApp;User Id=sa;Password=TravelApp_CI_2026;TrustServerCertificate=True
      CloudinarySettings__CloudName: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CloudinarySettings__ApiKey: ${{ secrets.CLOUDINARY_API_KEY }}
      CloudinarySettings__ApiSecret: ${{ secrets.CLOUDINARY_API_SECRET }}

      # Accounts on the runner's fresh database. ADMIN_* is the admin API/Data/Seed.cs creates; seed-users registers
      # the five test accounts with these passwords (9-21 characters with an upper-case letter, a lower-case letter
      # and a digit, or account/register refuses them) and grants their roles as that admin.
      ADMIN_USER: admin
      ADMIN_PASSWORD: Admin2024
      TEST_USER_1: test_user_1
      TEST_PASSWORD_1: CiTestUser1Pass
      TEST_USER_2: test_user_2
      TEST_PASSWORD_2: CiTestUser2Pass
      TEST_USER_3: test_user_3
      TEST_PASSWORD_3: CiTestUser3Pass
      TEST_USER_4: test_user_4
      TEST_PASSWORD_4: CiTestUser4Pass
      TEST_USER_5: test_user_5
      TEST_PASSWORD_5: CiTestUser5Pass

    steps:
      # Photo uploads go to a real Cloudinary account, and setup uploads one on every fresh database - without these
      # every layer after setup would be skipped, ten minutes into the run.
      - name: Check the Cloudinary secrets
        if: env.CloudinarySettings__CloudName == '' || env.CloudinarySettings__ApiKey == '' || env.CloudinarySettings__ApiSecret == ''
        run: |
          echo "::error::CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET must be set - README.md, \"Secrets and variables\""
          exit 1

      - uses: actions/checkout@v4

      - name: Check out the application
        uses: actions/checkout@v4
        with:
          repository: RuslanPidhainyi/EW-TravelApp-.Net8-Angular17
          # EW-021 holds the data-testid hooks and the product fixes the suite expects; main does not have them yet.
          ref: ${{ vars.APP_REF || 'EW-021' }}
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/Client/package-lock.json

      - name: Give Kestrel an HTTPS development certificate
        run: dotnet dev-certs https

      # Signs only the tokens of this run's throwaway API; TokenService wants at least 64 characters.
      - name: Generate the API's TokenKey
        run: |
          token_key="$(openssl rand -base64 64 | tr -d '\n')"
          echo "::add-mask::$token_key"
          echo "TokenKey=$token_key" >> "$GITHUB_ENV"

      - name: Install the client
        working-directory: app/Client
        run: npm ci

      - name: Install the suite
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Firefox and WebKit
        if: env.RUN_REGRESSION == 'true'
        run: npx playwright install --with-deps firefox webkit

      - name: seed-users, health, api, database, setup, smoke, accessibility, e2e
        if: env.RUN_REGRESSION != 'true'
        run: >-
          npx playwright test --project=smoke --project=accessibility --project=e2e
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=list,blob

      - name: seed-users, health, api, database, setup, smoke, accessibility, e2e, regression in three browsers
        if: env.RUN_REGRESSION == 'true'
        run: >-
          npx playwright test --project=smoke --project=accessibility --project=e2e
          --project=regression-chromium --project=regression-firefox --project=regression-webkit
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=list,blob

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

  report:
    name: merge the shard reports
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install the suite
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge the shards into HTML, JUnit, reports/test-ids.* and reports/custom-report/
        run: >-
          npx playwright merge-reports
          --reporter=html,junit,./src/reporters/testIdReporter.ts,./src/reporters/customReport/customReporter.ts
          ./all-blob-reports
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/junit.xml

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
          retention-days: 30
